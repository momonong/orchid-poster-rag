worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 192.168.51.175:8000;
    server_name cball.computing.ncku.edu.tw;
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host cball.computing.ncku.edu.tw;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 130s;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_redirect off;
    location = / { return 302 https://cball.computing.ncku.edu.tw/orchid-poster/tour-preview/; }
    location = /orchid-poster { return 302 https://cball.computing.ncku.edu.tw/orchid-poster/; }
    location = /orchid-poster/ { return 302 https://cball.computing.ncku.edu.tw/orchid-poster/tour-preview/; }
    location /orchid-poster/ { proxy_pass http://127.0.0.1:8000/; }
    location / { proxy_pass http://127.0.0.1:8000; }
  }
}
